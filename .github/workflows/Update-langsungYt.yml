name: Update LangsungYt Playlist

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (yt-dlp)
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Run Python Script
        run: python langsungYt.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add langsungYtb.m3u
          git commit -m "Auto-update langsungYtb.m3u [skip ci]" || exit 0
          git push
